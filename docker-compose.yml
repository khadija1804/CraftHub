services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: crafthub-mongo
    environment:
      MONGO_INITDB_DATABASE: craft_hub
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      

  # Backend API
  backend:
    build:
      context: ./crafthub-back
      dockerfile: Dockerfile
    container_name: crafthub-backend
    env_file:
      - ./crafthub-back/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/craft_hub
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./crafthub-back/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crafthub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python AI Services
  python-recommendation:
    build:
      context: ./crafthub-python
      dockerfile: Dockerfile.recommendation
    container_name: crafthub-python-recommendation
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-ai-main:
    build:
      context: ./crafthub-python
      dockerfile: Dockerfile
    container_name: crafthub-python-ai-main
    ports:
      - "5011:5011"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5011/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-translator:
    build:
      context: ./crafthub-python
      dockerfile: Dockerfile.translator
    container_name: crafthub-python-translator
    ports:
      - "5010:5010"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-scraper:
    build:
      context: ./crafthub-python
      dockerfile: Dockerfile.scraper
    container_name: crafthub-python-scraper
    ports:
      - "5005:5005"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-resume:
    build:
      context: ./crafthub-python
      dockerfile: Dockerfile.resume
    container_name: crafthub-python-resume
    ports:
      - "5003:5003"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-image-analyzer:
    build:
      context: ./crafthub-python
      dockerfile: Dockerfile.image-analyzer
    container_name: crafthub-python-image-analyzer
    ports:
      - "5007:5007"
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5007/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
